services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: homebakers
      POSTGRES_PASSWORD: homebakers
      POSTGRES_DB: homebakers_graph
    ports:
      - "5433:5432"
    volumes:
      - homebakers_graph_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homebakers -d homebakers_graph"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  homebakers_graph_pg_data:
